<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大会タイムテーブル - 唐崎ジュニアハイライト</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        karasaki: {
                            50: '#fffbebe6',
                            100: '#fef3c7',
                            500: '#f59e0b',
                            600: '#d97706',
                            700: '#b45309',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* タップしやすいアクティブ感とアニメーション */
        .karasaki-badge {
            background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
        }
        .touch-action-none { touch-action: manipulation; }
        ::-webkit-scrollbar { height: 6px; width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen pb-20">

    <!-- ヘッダー -->
    <header class="sticky top-0 z-30 bg-indigo-900 text-white shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <span class="text-xs bg-indigo-700 text-indigo-200 px-2 py-0.5 rounded font-semibold">2026/08/30</span>
                <h1 class="text-lg font-bold tracking-tight">第35回全小ダブルス大会</h1>
            </div>
            <div class="text-right">
                <span class="inline-flex items-center text-xs bg-amber-400 text-slate-900 px-2.5 py-1 rounded-full font-bold shadow-sm">
                    ★ 唐崎Jr.応援版
                </span>
            </div>
        </div>
        
        <!-- 唐崎フィルター ＆ 検索バー -->
        <div class="max-w-md mx-auto px-4 pb-3 space-y-2">
            <div class="flex items-center justify-between bg-indigo-950/60 p-2 rounded-xl backdrop-blur-sm border border-indigo-700/50">
                <label class="flex items-center cursor-pointer select-none space-x-2 text-sm font-medium">
                    <input type="checkbox" id="karasakiOnlyToggle" class="sr-only peer" onchange="filterData()">
                    <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-500 relative"></div>
                    <span class="text-amber-200 font-bold flex items-center gap-1 text-xs sm:text-sm">
                        <svg class="w-4 h-4 fill-amber-400" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                        唐崎ジュニアの試合のみ表示
                    </span>
                </label>
                <span id="karasakiMatchCount" class="text-xs text-amber-300 font-semibold bg-amber-950/80 px-2 py-0.5 rounded-full border border-amber-500/40">
                    -件
                </span>
            </div>

            <div class="relative">
                <input type="text" id="searchInput" oninput="filterData()" placeholder="選手名・ペア・種目名で検索..." class="w-full bg-slate-800 text-white placeholder-slate-400 text-sm rounded-lg pl-9 pr-8 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                <button onclick="clearSearch()" id="clearBtn" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-white">✕</button>
            </div>
        </div>

        <!-- タブナビゲーション -->
        <div class="flex border-t border-indigo-800 text-sm font-semibold text-center bg-indigo-950">
            <button onclick="switchTab('timetable')" id="tab-timetable" class="flex-1 py-2.5 border-b-2 border-amber-400 text-amber-400 transition-colors">
                時間軸 タイムテーブル
            </button>
            <button onclick="switchTab('players')" id="tab-players" class="flex-1 py-2.5 border-b-2 border-transparent text-slate-300 hover:text-white transition-colors">
                唐崎Jr. 選手別リスト
            </button>
            <button onclick="switchTab('categories')" id="tab-categories" class="flex-1 py-2.5 border-b-2 border-transparent text-slate-300 hover:text-white transition-colors">
                種目・組み合わせ
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-md mx-auto p-3 space-y-4">

        <!-- 1. タイムテーブル表示 -->
        <section id="view-timetable" class="space-y-4">
            <div class="flex items-center justify-between text-xs text-slate-500 px-1">
                <span>※試合時間は目安です。進行により前後します。</span>
                <span id="timetableCountInfo">全 0 試合</span>
            </div>
            
            <div id="timetableList" class="space-y-4">
                <!-- JavaScriptで時間帯ごとのブロックを挿入 -->
            </div>
        </section>

        <!-- 2. 唐崎ジュニア選手別一覧 -->
        <section id="view-players" class="hidden space-y-3">
            <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900 leading-relaxed shadow-sm">
                <span class="font-bold">唐崎ジュニア 出場選手・注目チーム</span>
                <p class="mt-0.5 text-amber-800">選手名をタップすると該当する試合の予定を絞り込めます。</p>
            </div>
            
            <div id="playerListContainer" class="space-y-3">
                <!-- JS生成 -->
            </div>
        </section>

        <!-- 3. 種目別トーナメント・組み合わせ -->
        <section id="view-categories" class="hidden space-y-3">
            <div id="categoryListContainer" class="space-y-3">
                <!-- JS生成 -->
            </div>
        </section>

    </main>

    <!-- フッターナビ（固定） -->
    <footer class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 py-2 px-4 z-20 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around text-center text-xs">
            <button onclick="scrollToTop()" class="flex flex-col items-center text-slate-600 hover:text-indigo-900">
                <svg class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/></svg>
                ページ上部へ
            </button>
            <button onclick="toggleFavOnly()" id="favToggleBtn" class="flex flex-col items-center text-slate-600 hover:text-amber-600">
                <svg id="favIcon" class="w-5 h-5 mb-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                <span id="favText">お気に入り</span>
            </button>
        </div>
    </footer>

    <!-- スクリプト部 -->
    <script>

            { time: "11:35", code: "6G-13", category: "女子6年ダブルス", court: "C4", round: "本戦", pairA: "南 結菜 / 鈎 玲音", teamA: "唐崎", pairB: "河村 楓 / 渡邉 稜", teamB: "北里/瀬田北", isKarasaki: true },
            { time: "11:35", code: "6G-14", category: "女子6年ダブルス", court: "C5", round: "本戦", pairA: "福田 星来 / パートナー", teamA: "エミー", pairB: "深田 圭 / パートナー", teamB: "瀬田北", isKarasaki: false },
            { time: "11:35", code: "5G-9", category: "女子5年ダブルス", court: "C1", round: "本戦", pairA: "川西 凛 / 春本 彩陽", teamA: "唐崎", pairB: "梅田/小西 ペア", teamB: "他", isKarasaki: true },
            { time: "11:35", code: "5G-10", category: "女子5年ダブルス", court: "C2", round: "本戦", pairA: "選手 / 選手", teamA: "他", pairB: "選手 / 選手", teamB: "他", isKarasaki: false },
            { time: "11:35", code: "6B-3", category: "男子6年ダブルス", court: "C8", round: "準決勝", pairA: "堀・安原勝者", teamA: "唐崎/他", pairB: "対戦相手", teamB: "他", isKarasaki: true },

            // 12:00
            { time: "12:00", code: "5B-7", category: "男子5年ダブルス", court: "C1", round: "準決勝", pairA: "辻ペア勝者", teamA: "唐崎/他", pairB: "対戦相手", teamB: "他", isKarasaki: true },
            { time: "12:00", code: "6Z-7", category: "6年チャレンジT", court: "C4", round: "2回戦", pairA: "選手 / 選手", teamA: "他", pairB: "選手 / 選手", teamB: "他", isKarasaki: false },

            // 12:50 昼休憩
            { time: "12:50", code: "LUNCH", category: "昼休憩", court: "全体", round: "休憩", pairA: "-", teamA: "", pairB: "-", teamB: "", isKarasaki: false, isBreak: true },

            // 13:15
            { time: "13:15", code: "6ZX-3", category: "6年チャレンジ交流", court: "C1", round: "交流戦", pairA: "選手 / 選手", teamA: "他", pairB: "選手 / 選手", teamB: "他", isKarasaki: false },

            // 13:40
            { time: "13:40", code: "6G-決勝", category: "女子6年ダブルス", court: "C3", round: "決勝戦", pairA: "南・鈎ペア(想定)", teamA: "唐崎", pairB: "決勝進出ペア", teamB: "他", isKarasaki: true },
            { time: "13:40", code: "6G-三決", category: "女子6年ダブルス", court: "C4", round: "3位決定戦", pairA: "3位決定ペア", teamA: "他", pairB: "3位決定ペア", teamB: "他", isKarasaki: false },
            { time: "13:40", code: "5G-決勝", category: "女子5年ダブルス", court: "C5", round: "決勝戦", pairA: "川西・春本ペア(想定)", teamA: "唐崎", pairB: "決勝進出ペア", teamB: "他", isKarasaki: true },

            // 14:05
            { time: "14:05", code: "6B-決勝", category: "男子6年ダブルス", court: "C1", round: "決勝戦", pairA: "堀・安原ペア(想定)", teamA: "唐崎", pairB: "決勝進出ペア", teamB: "他", isKarasaki: true },
            { time: "14:05", code: "5B-決勝", category: "男子5年ダブルス", court: "C3", round: "決勝戦", pairA: "辻ペア(想定)", teamA: "唐崎", pairB: "決勝進出ペア", teamB: "他", isKarasaki: true },

            // 14:30
            { time: "14:30", code: "6Z-決勝", category: "6年チャレンジT", court: "C3", round: "決勝戦", pairA: "選手 / 選手", teamA: "他", pairB: "選手 / 選手", teamB: "他", isKarasaki: false },

            // 14:55
            { time: "14:55", code: "6GX2-二決", category: "女子6年 2位決定戦", court: "C4", round: "2位決定", pairA: "15敗者 / 16勝者", teamA: "他", pairB: "-", teamB: "", isKarasaki: false }
        ];

        // 唐崎ジュニアのキー選手リスト
        const karasakiPlayers = [
            { name: "堀 聡佑 & 安原 悠", category: "男子6年ダブルス（6B）", matches: ["6B-1", "6B-3", "6B-決勝"] },
            { name: "辻 琉希 & パートナー", category: "男子5年ダブルス（5B）", matches: ["5B-2", "5B-7", "5B-決勝"] },
            { name: "南 結菜 & 鈎 玲音", category: "女子6年ダブルス（6G）", matches: ["6G-13", "6G-決勝"] },
            { name: "川西 凛 & 春本 彩陽", category: "女子5年ダブルス（5G）", matches: ["5G-9", "5G-決勝"] },
            { name: "唐崎女子4年ペア", category: "女子4年ダブルス（4G）", matches: ["4G-5"] }
        ];

        let favorites = JSON.parse(localStorage.getItem('karasaki_favs') || '[]');
        let currentTab = 'timetable';
        let showFavOnly = false;

        // 初期ロード
        window.addEventListener('DOMContentLoaded', () => {
            updateKarasakiCount();
            renderTimetable();
            renderPlayers();
            renderCategories();
        });

        // 唐崎ジュニアカウント更新
        function updateKarasakiCount() {
            const count = matchesData.filter(m => m.isKarasaki).length;
            document.getElementById('karasakiMatchCount').innerText = `唐崎関連: ${count}試合`;
        }

        // タブ切り替え
        function switchTab(tab) {
            currentTab = tab;
            ['timetable', 'players', 'categories'].forEach(t => {
                const view = document.getElementById(`view-${t}`);
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    view.classList.remove('hidden');
                    btn.classList.add('border-amber-400', 'text-amber-400');
                    btn.classList.remove('border-transparent', 'text-slate-300');
                } else {
                    view.classList.add('hidden');
                    btn.classList.remove('border-amber-400', 'text-amber-400');
                    btn.classList.add('border-transparent', 'text-slate-300');
                }
            });
        }

        // フィルタ処理
        function filterData() {
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
            const karasakiOnly = document.getElementById('karasakiOnlyToggle').checked;
            
            document.getElementById('clearBtn').classList.toggle('hidden', searchVal === '');

            renderTimetable(searchVal, karasakiOnly);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            filterData();
        }

        // タイムテーブル表示描画
        function renderTimetable(searchQuery = '', karasakiOnly = false) {
            const container = document.getElementById('timetableList');
            container.innerHTML = '';

            // フィルタリング
            let filtered = matchesData.filter(m => {
                if (m.isBreak) return !karasakiOnly && searchQuery === '';
                if (karasakiOnly && !m.isKarasaki) return false;
                if (showFavOnly && !favorites.includes(m.code)) return false;

                if (searchQuery) {
                    const matchText = `${m.time} ${m.code} ${m.category} ${m.pairA} ${m.teamA} ${m.pairB} ${m.teamB} ${m.court}`.toLowerCase();
                    return matchText.includes(searchQuery);
                }
                return true;
            });

            document.getElementById('timetableCountInfo').innerText = `表示中: ${filtered.length} 試合`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-10 text-slate-400">
                        <svg class="w-12 h-12 mx-auto mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 9.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        該当する試合が見つかりませんでした。
                    </div>
                `;
                return;
            }

            // 時間帯ごとにグループ化
            const timeGroups = {};
            filtered.forEach(m => {
                if (!timeGroups[m.time]) timeGroups[m.time] = [];
                timeGroups[m.time].push(m);
            });

            Object.keys(timeGroups).forEach(time => {
                const groupEl = document.createElement('div');
                groupEl.className = 'bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden';

                const isLunch = time === "12:50";

                let headerHtml = `
                    <div class="bg-slate-800 text-white px-3.5 py-2 flex justify-between items-center ${isLunch ? 'bg-emerald-800' : ''}">
                        <div class="flex items-center space-x-2">
                            <span class="text-lg font-bold tracking-tight">${time}</span>
                            <span class="text-xs bg-slate-700 px-2 py-0.5 rounded text-slate-200">${timeGroups[time].length} 試合</span>
                        </div>
                        ${isLunch ? '<span class="text-xs bg-emerald-700 px-2 py-0.5 rounded font-bold">昼休憩</span>' : ''}
                    </div>
                `;

                let matchesHtml = '<div class="divide-y divide-slate-100">';
                
                timeGroups[time].forEach(m => {
                    if (m.isBreak) {
                        matchesHtml += `
                            <div class="p-4 text-center text-emerald-700 font-semibold text-sm bg-emerald-50/50">
                                🍱 12:50 - 13:15 昼休憩・出張販売（近江牛カレーパン他）
                            </div>
                        `;
                        return;
                    }

                    const isFav = favorites.includes(m.code);
                    const highlightClass = m.isKarasaki 
                        ? 'bg-amber-50/80 border-l-4 border-l-amber-500' 
                        : 'hover:bg-slate-50';

                    matchesHtml += `
                        <div class="p-3.5 relative transition-colors ${highlightClass}">
                            <div class="flex justify-between items-start mb-1.5">
                                <div class="flex items-center space-x-1.5 flex-wrap gap-y-1">
                                    <span class="font-mono font-bold text-xs bg-slate-900 text-white px-2 py-0.5 rounded">
                                        ${m.code}
                                    </span>
                                    <span class="text-xs font-semibold text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded">
                                        ${m.court} コート
                                    </span>
                                    <span class="text-xs font-bold text-indigo-900">
                                        ${m.category} (${m.round})
                                    </span>
                                    ${m.isKarasaki ? `
                                        <span class="karasaki-badge text-white text-[10px] font-extrabold px-2 py-0.5 rounded-full shadow-sm flex items-center gap-0.5">
                                            ★ 唐崎Jr.
                                        </span>
                                    ` : ''}
                                </div>
                                <button onclick="toggleFav('${m.code}')" class="text-slate-300 hover:text-amber-400 p-1">
                                    <svg class="w-5 h-5 ${isFav ? 'fill-amber-400 text-amber-400' : 'fill-none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                                </button>
                            </div>

                            <!-- 対戦 カード -->
                            <div class="grid grid-cols-11 items-center gap-1 text-sm pt-1">
                                <div class="col-span-5 text-right font-semibold ${m.teamA.includes('唐崎') ? 'text-amber-700 font-bold' : 'text-slate-800'}">
                                    <div>${m.pairA}</div>
                                    <div class="text-[11px] text-slate-400 font-normal">(${m.teamA})</div>
                                </div>
                                <div class="col-span-1 text-center font-bold text-xs text-slate-300">
                                    VS
                                </div>
                                <div class="col-span-5 text-left font-semibold ${m.teamB.includes('唐崎') ? 'text-amber-700 font-bold' : 'text-slate-800'}">
                                    <div>${m.pairB}</div>
                                    <div class="text-[11px] text-slate-400 font-normal">(${m.teamB})</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                matchesHtml += '</div>';
                groupEl.innerHTML = headerHtml + matchesHtml;
                container.appendChild(groupEl);
            });
        }

        // 唐崎選手別リスト描画
        function renderPlayers() {
            const container = document.getElementById('playerListContainer');
            container.innerHTML = '';

            karasakiPlayers.forEach(player => {
                const playerMatches = matchesData.filter(m => player.matches.includes(m.code));
                
                let matchesListHtml = '';
                playerMatches.forEach(m => {
                    matchesListHtml += `
                        <div class="bg-amber-50/50 p-2.5 rounded-lg border border-amber-200/60 flex justify-between items-center text-xs">
                            <div>
                                <span class="font-bold text-slate-700 mr-1.5">${m.time}</span>
                                <span class="bg-amber-500 text-white font-bold px-1.5 py-0.5 rounded text-[10px] mr-1">${m.code}</span>
                                <span class="text-slate-600">${m.court}コート</span>
                                <div class="text-amber-900 font-semibold mt-0.5">対戦: ${m.pairB} (${m.teamB})</div>
                            </div>
                            <span class="text-[11px] bg-white border border-amber-300 text-amber-800 px-2 py-1 rounded-full font-bold">
                                ${m.round}
                            </span>
                        </div>
                    `;
                });

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-2";
                card.innerHTML = `
                    <div class="flex justify-between items-start border-b border-slate-100 pb-2">
                        <div>
                            <span class="text-xs font-bold text-amber-600 bg-amber-100 px-2 py-0.5 rounded-full">唐崎ジュニア</span>
                            <h3 class="text-base font-bold text-slate-900 mt-1">${player.name}</h3>
                            <p class="text-xs text-slate-500">${player.category}</p>
                        </div>
                        <span class="text-xs font-bold text-slate-400">${playerMatches.length} 試合予定</span>
                    </div>
                    <div class="space-y-1.5 pt-1">
                        ${matchesListHtml}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 種目一覧描画
        function renderCategories() {
            const container = document.getElementById('categoryListContainer');
            container.innerHTML = '';

            const categories = [...new Set(matchesData.map(m => m.category))].filter(c => c !== "昼休憩");

            categories.forEach(cat => {
                const catMatches = matchesData.filter(m => m.category === cat);
                const hasKarasaki = catMatches.some(m => m.isKarasaki);

                const div = document.createElement('div');
                div.className = "bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden";
                div.innerHTML = `
                    <div class="bg-slate-100 px-3.5 py-2.5 flex justify-between items-center border-b border-slate-200">
                        <span class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
                            ${cat}
                            ${hasKarasaki ? '<span class="text-[10px] bg-amber-500 text-white font-extrabold px-1.5 py-0.2 rounded">唐崎出場</span>' : ''}
                        </span>
                        <span class="text-xs text-slate-500">${catMatches.length} 試合</span>
                    </div>
                    <div class="p-2 divide-y divide-slate-100">
                        ${catMatches.map(m => `
                            <div class="py-2 px-1 flex justify-between items-center text-xs ${m.isKarasaki ? 'bg-amber-50/60 rounded px-2 font-medium' : ''}">
                                <div>
                                    <span class="font-bold text-slate-900">${m.code}</span>
                                    <span class="text-slate-400 ml-1">(${m.time} / ${m.court})</span>
                                    <div class="text-slate-700 mt-0.5">${m.pairA} vs ${m.pairB}</div>
                                </div>
                                <span class="text-[10px] text-slate-500 bg-slate-100 px-1.5 py-0.5 rounded">${m.round}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        // お気に入りトグル
        function toggleFav(code) {
            if (favorites.includes(code)) {
                favorites = favorites.filter(c => c !== code);
            } else {
                favorites.push(code);
            }
            localStorage.setItem('karasaki_favs', JSON.stringify(favorites));
            filterData();
        }

        function toggleFavOnly() {
            showFavOnly = !showFavOnly;
            const btn = document.getElementById('favToggleBtn');
            const icon = document.getElementById('favIcon');
            const text = document.getElementById('favText');

            if (showFavOnly) {
                btn.classList.add('text-amber-600');
                icon.classList.add('fill-amber-400');
                text.innerText = 'お気に入り中';
            } else {
                btn.classList.remove('text-amber-600');
                icon.classList.remove('fill-amber-400');
                text.innerText = 'お気に入り';
            }
            filterData();
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
