<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>共有タイムテーブル</title>
<style>
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif; margin:0; color:#222; background:#fff; -webkit-text-size-adjust:100%;}
header.top{padding:10px 12px 6px; border-bottom:1px solid #ddd;}
h1{font-size:17px; margin:0 0 2px; line-height:1.35;}
.sub{font-size:12px; color:#555;}
.statusrow{display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:#555; flex-wrap:wrap;}
.dot{width:9px; height:9px; border-radius:50%; background:#999; display:inline-block;}
.dot.on{background:#2fbf71;} .dot.mid{background:#e8b13c;} .dot.off{background:#e05a5a;}
.badge{border:1px solid #bbb; border-radius:999px; padding:1px 8px; font-size:11px; background:#f4f6fb;}
.badge.op{border-color:#e65100; color:#bf360c; font-weight:bold;}
.legend{display:flex; flex-wrap:wrap; gap:6px; margin:8px 12px 0; font-size:12px;}
.legend span{padding:3px 8px; border-radius:6px; border:1px solid #bbb;}
.lg-kz{background:#ffe082; font-weight:bold;}
.lg-poss{background:#dcedc8;}
.lg-decided{background:#eeeeee;}
.toolbar{position:sticky; top:0; z-index:30; background:#fff; padding:6px 12px; border-bottom:1px solid #ddd; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.toolbar button{font-size:13.5px; padding:8px 11px; border-radius:8px; border:1.5px solid #305496; background:#fff; color:#305496; font-weight:bold; cursor:pointer; min-height:40px;}
.toolbar button.on{background:#305496; color:#fff;}
.toolbar select{font-size:14px; padding:8px 6px; border-radius:8px; border:1.5px solid #bbb; min-height:40px; background:#fff;}
.search{flex:1 1 120px; padding:9px 10px; border-radius:8px; border:1.5px solid #bbb; font-size:15px; min-height:40px;}
main{padding:0 0 34px;}
/* ---- 表形式 ---- */
.gridwrap{overflow:auto; -webkit-overflow-scrolling:touch; max-height:calc(100vh - 118px); border-bottom:2px solid #305496;}
table.tt{border-collapse:separate; border-spacing:0; min-width:1240px; width:100%;}
table.tt th, table.tt td{border-right:1px solid #bbb; border-bottom:1px solid #bbb; padding:4px 3px; vertical-align:top; min-width:64px;}
table.tt thead th{background:#305496; color:#fff; font-size:12px; position:sticky; top:0; z-index:3; text-align:center;}
table.tt th.time{background:#5b7ec2; color:#fff; font-size:14px; font-weight:bold; text-align:center; min-width:50px; position:sticky; left:0; z-index:2; border-right:2px solid #305496;}
table.tt thead th.time{z-index:4;}
td .code{font-size:11.5px; font-weight:bold; color:#555;}
td.kz{background:#ffe082; cursor:pointer;}
td.poss{background:#eef6e6; cursor:pointer;}
td.decided{background:#f0f0f0;}
td .who{display:block; font-size:12.5px; font-weight:bold; line-height:1.3; color:#222;}
td .who.win{color:#2e7d32;}
td .who.lose{color:#999; text-decoration:line-through;}
td .lbl{display:block; font-size:11px; color:#666; line-height:1.3;}
td .tm{display:block; font-size:10px; color:#888;}
td.kz .who{font-size:13.5px;}
/* ---- リスト形式 ---- */
.listwrap{padding:4px 10px 0; max-width:640px; margin:0 auto;}
.thead{font-size:15px; font-weight:bold; color:#305496; margin:14px 0 6px; border-left:6px solid #305496; padding-left:8px;}
.mcard{border:1.5px solid #bbb; border-radius:10px; padding:7px 9px; margin-bottom:7px; background:#fff;}
.mcard.kz{background:#fff8e1; border-color:#e65100;}
.mcard.poss{background:#f4f9ef;}
.mcard.decided{background:#f4f4f4;}
.m-top{display:flex; gap:8px; align-items:baseline;}
.m-code{font-size:13px; font-weight:bold; color:#bf360c;}
.m-phase{font-size:11px; color:#fff; background:#5b7ec2; border-radius:5px; padding:1px 6px; font-weight:bold;}
.m-phase.u{background:#8e24aa;} .m-phase.w{background:#00838f;}
.m-court{font-size:12.5px; color:#305496; font-weight:bold;}
.m-time{margin-left:auto; font-size:12.5px; color:#555; font-variant-numeric:tabular-nums;}
.vsrow{display:flex; align-items:stretch; gap:6px; margin-top:6px;}
.side{flex:1; border:1.5px solid #ccc; border-radius:9px; padding:8px 9px; background:#fff; text-align:left; font-family:inherit;}
button.side{cursor:pointer;}
button.side:active{background:#e3f2fd;}
.side .nm{font-size:16.5px; font-weight:800; line-height:1.3; display:block;}
.mcard.kz .side .nm{font-size:18px;}
.side .tm{font-size:11px; color:#777; display:block; margin-top:1px;}
.side .lbl{font-size:14px; font-weight:700; color:#666; display:block; line-height:1.35;}
.side.win{border-color:#2e7d32; background:#e8f5e9;}
.side.win .nm{color:#2e7d32;}
.side.lose{opacity:.55;} .side.lose .nm{text-decoration:line-through;}
.side .winmark{font-size:11px; font-weight:800; color:#fff; background:#2e7d32; border-radius:5px; padding:0 6px; margin-left:6px; vertical-align:2px;}
.vsmid{align-self:center; font-size:12px; color:#999; font-weight:bold;}
.tapnote{font-size:11px; color:#888; margin-top:5px;}
.btn-undo{margin:8px 12px 0; padding:11px 14px; font-weight:700; border-radius:8px; border:1.5px solid #8e24aa; color:#8e24aa; background:#fff; cursor:pointer; width:calc(100% - 24px); max-width:616px;}
.sharebox{margin:8px 12px 0; max-width:640px;}
.sharebox button{width:100%; padding:13px; font-size:15px; font-weight:800; border:none; border-radius:10px; background:#e8c476; color:#231a05; cursor:pointer;}
/* ---- 順位 / 選手別 / 履歴 ---- */
.cards{padding:10px 10px 0; max-width:640px; margin:0 auto;}
.gtitle{font-size:14px; color:#305496; font-weight:800; margin:14px 0 6px;}
table.st{border-collapse:collapse; width:100%; margin-bottom:6px; background:#fff;}
table.st th, table.st td{border:1px solid #bbb; padding:5px 7px; font-size:13.5px;}
table.st th{background:#eef2fa; font-size:12px; text-align:left;}
table.st td.rk{font-weight:800; text-align:center; width:34px;}
table.st tr.kz td{background:#fff3c4; font-weight:700;}
table.st tr.zone-u td.rk{background:#ffe082;}
table.st tr.zone-w td.rk{background:#d1c4e9;}
table.st .wl{font-variant-numeric:tabular-nums; white-space:nowrap;}
.blockmeta{font-size:11.5px; color:#777; margin:2px 0 8px;}
.prow{border:1px solid #bbb; border-radius:10px; padding:9px 10px; margin-bottom:8px; background:#fff;}
.prow.kz{border-color:#e65100; background:#fff8e1;}
.prow .pname{font-weight:800; font-size:16.5px;}
.prow .pmeta{font-size:11.5px; color:#555;}
.prow .pm{font-size:12.5px; color:#444; margin-top:4px; line-height:1.55;}
.prow .pm .w{color:#2e7d32; font-weight:800;} .prow .pm .l{color:#8e24aa; font-weight:800;}
.hrow{font-size:13.5px; padding:9px 10px; border:1px solid #bbb; border-radius:9px; margin-bottom:6px; background:#fff;}
.hrow .w{color:#2e7d32; font-weight:800;}
.empty{color:#777; text-align:center; padding:26px 8px; font-size:14px;}
.note{font-size:12px; color:#555; padding:10px 12px 0; line-height:1.6; max-width:900px;}
#toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:#305496; color:#fff; padding:10px 16px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:92vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.hidden{display:none !important;}
.flash{animation:fl 1.6s;}
@keyframes fl{0%{box-shadow:0 0 0 5px #e65100;}100%{box-shadow:0 0 0 0 transparent;}}
</style>
</head>
<body>
<header class="top">
  <h1 id="h-title">共有タイムテーブル</h1>
  <div class="sub" id="h-meta"></div>
  <div class="statusrow">
    <span class="dot" id="conn-dot"></span><span id="conn-text">未接続</span>
    <span class="badge op" id="mode-badge">みんなで編集</span>
    <span class="badge hidden" id="count-badge"></span>
  </div>
</header>

<section id="view-room">
  <div class="legend">
    <span class="lg-kz">■ 唐崎ジュニアの試合</span>
    <span class="lg-poss">■ 唐崎の選手が入る可能性のある試合</span>
    <span class="lg-decided">■ 結果入力済み（勝者は緑）</span>
  </div>
  <div class="sharebox">
    <button id="btn-copy-url">このページのURLをコピーして共有する</button>
  </div>
  <div class="toolbar">
    <button data-tab="list" class="on">リスト</button>
    <button data-tab="grid">表形式</button>
    <button data-tab="standings">リーグ順位</button>
    <button data-tab="players">選手別（唐崎）</button>
    <button data-tab="history">履歴</button>
    <select id="f-cls">
      <option value="">全クラス</option>
      <option value="A">Aクラス</option><option value="B">Bクラス</option>
      <option value="C">Cクラス</option><option value="D">Dクラス</option>
      <option value="E">Eクラス</option><option value="F">Fクラス</option>
      <option value="G">Gクラス</option>
    </select>
    <input class="search" id="q" type="search" placeholder="選手名・試合番号で探す" autocomplete="off" />
    <button id="btn-kara">唐崎の試合だけ</button>
  </div>
  <button class="btn-undo hidden" id="btn-undo">↩ 直前の入力を1つ取り消す</button>
  <main id="list"></main>
  <p class="note">使い方：試合の勝った選手の名前をタップすると、全員の画面に反映されます（間違えたら「履歴」か上の取り消しボタンで戻せます）。リーグ戦の結果がそろうと順位が自動で決まり、トーナメントの枠に名前が入ります。順位は勝ち数で計算します。同率で並んだ場合は枠に名前が入らないことがあります（公式順位は本部の発表で確認してください）。時刻はタイムスケジュールの目安で、当日はコールによる流し込み方式のため前後します。</p>
</section>
<div id="toast"></div>

<script>
"use strict";
var DATA = JSON.parse(document.getElementById("tournament-data").textContent);
var TEAM = DATA.meta.team;
var MATCH = {}; DATA.matches.forEach(function(m){ MATCH[m.code] = m; });
var COURTS = 12;

// === 結果の集計（LOGIC） ===
function effectiveEntries(entries){
  var undone = {};
  (entries||[]).forEach(function(e){ if (e && e.undo && e.target) undone[e.target] = true; });
  return (entries||[]).filter(function(e){ return e && !e.undo && !undone[e.id]; });
}
function mergeEntries(a, b){
  var byId = {}, out = [];
  [a||[], b||[]].forEach(function(list){
    list.forEach(function(e){ if (e && e.id && !byId[e.id]){ byId[e.id] = true; out.push(e); } });
  });
  out.sort(function(x, y){ return (x.at||0) - (y.at||0) || (x.id < y.id ? -1 : 1); });
  return out;
}
function resultsMap(entries){
  // 試合コード -> 勝者側(0/1)。同じ試合は先に入った方が有効
  var map = {};
  effectiveEntries(entries).forEach(function(e){
    if (e.code && (e.side === 0 || e.side === 1) && !(e.code in map)) map[e.code] = e.side;
  });
  return map;
}
function blockPlayers(cls, block){
  var seen = {}, out = [];
  DATA.matches.forEach(function(m){
    if (m.phase === "L" && m.cls === cls && m.block === block){
      m.slots.forEach(function(s){
        if (s[0] === "p" && !seen[s[1]]){ seen[s[1]] = true; out.push({name: s[1], team: s[2]}); }
      });
    }
  });
  return out;
}
function blockMatches(cls, block){
  return DATA.matches.filter(function(m){ return m.phase === "L" && m.cls === cls && m.block === block; });
}
function standings(cls, block, res){
  // [{name, team, w, l}] 勝ち数降順
  var st = {};
  blockPlayers(cls, block).forEach(function(p){ st[p.name] = {name: p.name, team: p.team, w: 0, l: 0}; });
  blockMatches(cls, block).forEach(function(m){
    var side = res[m.code];
    if (side === undefined) return;
    var wn = m.slots[side][1], ln = m.slots[1 - side][1];
    if (st[wn]) st[wn].w++;
    if (st[ln]) st[ln].l++;
  });
  var arr = Object.keys(st).map(function(k){ return st[k]; });
  arr.sort(function(a, b){ return b.w - a.w || a.l - b.l || (a.name < b.name ? -1 : 1); });
  return arr;
}
function blockComplete(cls, block, res){
  return blockMatches(cls, block).every(function(m){ return res[m.code] !== undefined; });
}
function rankPlayer(cls, block, rank, res){
  // ブロック全試合が終わり、勝ち数でその順位が1人に定まる場合だけ選手を返す
  if (!blockComplete(cls, block, res)) return null;
  var st = standings(cls, block, res);
  if (rank < 1 || rank > st.length) return null;
  var target = st[rank - 1];
  var tied = st.filter(function(p){ return p.w === target.w; });
  if (tied.length > 1){
    // 同率グループが順位の境界をまたぐ場合は確定できない
    var firstIdx = st.indexOf(tied[0]);
    var lastIdx = st.indexOf(tied[tied.length - 1]);
    if (rank - 1 >= firstIdx && rank - 1 <= lastIdx) return null;
  }
  return target;
}
function slotLabel(slot){
  if (slot[0] === "r") return slot[1] + "ブロック" + slot[2] + "位";
  if (slot[0] === "w") return slot[1] + "の勝者";
  return "";
}
function resolveSlot(slot, res){
  if (slot[0] === "p") return {name: slot[1], team: slot[2], label: null};
  if (slot[0] === "r"){
    // r スロットは自クラスのブロック順位
    return {name: null, team: null, label: slotLabel(slot), rank: slot};
  }
  if (slot[0] === "w"){
    var src = MATCH[slot[1]];
    if (src && res[slot[1]] !== undefined){
      var inner = resolveMatch(src, res).slots[res[slot[1]]];
      if (inner && inner.name) return inner;
    }
    return {name: null, team: null, label: slotLabel(slot)};
  }
  return {name: null, team: null, label: ""};
}
function resolveMatch(m, res){
  var slots = m.slots.map(function(s){
    if (s[0] === "r"){
      var p = rankPlayer(m.cls, s[1], s[2], res);
      if (p) return {name: p.name, team: p.team, label: null};
      return {name: null, team: null, label: slotLabel(s)};
    }
    return resolveSlot(s, res);
  });
  return {slots: slots, decided: (res[m.code] !== undefined ? res[m.code] : null)};
}
function possiblePlayers(slot, m, guard){
  guard = guard || {};
  if (guard[m.code]) return [];
  if (slot[0] === "p") return [{name: slot[1], team: slot[2]}];
  if (slot[0] === "r") return blockPlayers(m.cls, slot[1]);
  if (slot[0] === "w"){
    var src = MATCH[slot[1]];
    if (!src) return [];
    guard[m.code] = true;
    var out = [];
    src.slots.forEach(function(s2){ out = out.concat(possiblePlayers(s2, src, guard)); });
    return out;
  }
  return [];
}
function matchFlags(m, res){
  var rm = resolveMatch(m, res);
  var kz = rm.slots.some(function(s){ return s.team && s.team.indexOf(TEAM) >= 0; });
  var poss = false;
  if (!kz){
    poss = m.slots.some(function(s){
      return possiblePlayers(s, m).some(function(p){ return p.team && p.team.indexOf(TEAM) >= 0; });
    });
  }
  return {rm: rm, kz: kz, poss: poss};
}
// === LOGIC END ===
</script>
<script>
"use strict";
var BROKERS = ["wss://mqtt.eclipseprojects.io:443/mqtt", "wss://broker.emqx.io:8084/mqtt", "wss://broker.hivemq.com:8884/mqtt"];
var TOPIC_PREFIX = "kztt/v1/";
var ALPHABET = "abcdefghjkmnpqrstuvwxyz23456789";
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function toast(msg){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._h); toast._h=setTimeout(function(){t.classList.remove("show");},2600); }
function randStr(n){ var b=new Uint8Array(n); crypto.getRandomValues(b); var s=""; for(var i=0;i<n;i++) s+=ALPHABET[b[i]%ALPHABET.length]; return s; }
function sha256hex(str){ return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(x){ return ("0"+x.toString(16)).slice(-2); }).join(""); }); }

var App = {
  room: DATA.meta.shared.room, key: DATA.meta.shared.key, vhash: null,
  state: {v: 1, seq: 0, entries: []},
  tab: (window.innerWidth >= 821 ? "grid" : "list"), karaOnly: false,
  client: null, connected: false, bc: null, ready: false,
  lsKey: function(){ return "kztt_state_" + this.room; },
  saveLocal: function(){ try{ localStorage.setItem(this.lsKey(), JSON.stringify(this.state)); }catch(e){} },
  loadLocal: function(){ try{ var s = localStorage.getItem(this.lsKey()); if (s){ var st = JSON.parse(s); if (st && st.v === 1 && Array.isArray(st.entries)){ this.state = st; } } }catch(e){} },
  setConn: function(kind, text){ var d = $("conn-dot"); d.className = "dot " + kind; $("conn-text").textContent = text; },
  startSync: function(){
    var self = this;
    sha256hex(this.key).then(function(h){ self.vhash = h; });
    try{ this.bc = new BroadcastChannel("kztt-" + this.room); this.bc.onmessage = function(ev){ self.receive(ev.data); }; }catch(e){}
    this.setConn("mid", "接続中…");
    if (typeof mqtt === "undefined"){ this.setConn("off", "中継ライブラリを読み込めませんでした"); this.ready = true; render(); return; }
    this.connectBroker(0);
    setTimeout(function(){ self.ready = true; render(); }, 2600);
  },
  connectBroker: function(idx){
    var self = this;
    var client;
    try{ client = mqtt.connect(BROKERS[idx], {clientId: "kztt-" + randStr(10), reconnectPeriod: 4000, connectTimeout: 9000, keepalive: 40, clean: true}); }
    catch(e){ if (idx + 1 < BROKERS.length) return this.connectBroker(idx + 1); this.setConn("off", "中継に接続できません"); return; }
    this.client = client;
    var got = false;
    setTimeout(function(){ if (!got && idx + 1 < BROKERS.length){ try{ client.end(true); }catch(e){} self.connectBroker(idx + 1); } }, 10000);
    client.on("connect", function(){
      got = true; self.connected = true; self.setConn("on", "接続中（共有中）");
      client.subscribe(TOPIC_PREFIX + self.room, {qos: 1}, function(err){
        if (!err && self.state.seq > 0) self.publish();
      });
    });
    client.on("reconnect", function(){ self.connected = false; self.setConn("mid", "再接続中…"); });
    client.on("offline", function(){ self.connected = false; self.setConn("mid", "再接続中…"); });
    client.on("error", function(){ self.setConn("mid", "再接続中…"); });
    client.on("message", function(topic, buf){ try{ self.receive(JSON.parse(buf.toString())); }catch(e){} });
  },
  publish: function(){
    var self = this;
    if (!this.vhash) return;
    var stateJson = JSON.stringify(this.state);
    sha256hex(this.vhash + "|" + this.state.seq + "|" + stateJson).then(function(proof){
      var payload = {state: self.state, seq: self.state.seq, proof: proof};
      if (self.bc){ try{ self.bc.postMessage(payload); }catch(e){} }
      if (self.client && self.connected){ self.client.publish(TOPIC_PREFIX + self.room, JSON.stringify(payload), {retain: true, qos: 1}); }
    });
  },
  receive: function(payload){
    if (!payload || typeof payload.seq !== "number" || !payload.state || !this.vhash) return;
    var self = this;
    var stateJson = JSON.stringify(payload.state);
    sha256hex(this.vhash + "|" + payload.seq + "|" + stateJson).then(function(proof){
      if (proof !== payload.proof) return;
      var merged = mergeEntries(self.state.entries, payload.state.entries);
      var changedLocal = JSON.stringify(merged) !== JSON.stringify(self.state.entries);
      var differsRemote = JSON.stringify(merged) !== JSON.stringify(payload.state.entries);
      if (changedLocal){
        self.state = {v: 1, seq: Math.max(self.state.seq, payload.seq), entries: merged};
        self.ready = true;
        self.saveLocal();
        render();
      }
      if (differsRemote){
        self.state.seq = Math.max(self.state.seq, payload.seq) + 1;
        self.saveLocal();
        self.publish();
      }
    });
  },
  record: function(code, side){
    if (!this.ready) return;
    var m = MATCH[code]; if (!m) return;
    var res = resultsMap(this.state.entries);
    if (res[code] !== undefined) return;
    var rm = resolveMatch(m, res);
    if (!rm.slots[side].name) return;
    this.state.entries.push({id: Date.now().toString(36) + randStr(4), code: code, side: side, at: Date.now()});
    this.state.seq += 1;
    this.saveLocal(); this.publish(); render();
    toast(rm.slots[side].name + " の勝ち（" + code + "）を共有しました");
  },
  undo: function(){
    var eff = effectiveEntries(this.state.entries);
    if (!eff.length) return;
    var last = eff[eff.length - 1];
    this.state.entries.push({id: Date.now().toString(36) + randStr(4), undo: true, target: last.id, at: Date.now()});
    this.state.seq += 1;
    this.saveLocal(); this.publish(); render();
    toast("直前の入力を取り消しました");
  }
};

function phaseLabel(m){
  if (m.phase === "L") return m.cls + "クラス " + m.block + "ブロック";
  if (m.phase === "U") return m.cls + "クラス 上位" + (m.code.indexOf("決勝") >= 0 ? "決勝" : "");
  return m.cls + "クラス 下位" + (m.code.indexOf("決勝") >= 0 ? "決勝" : "");
}
function phaseShort(m){
  if (m.phase === "L") return "リーグ";
  if (m.phase === "U") return m.code.indexOf("決勝") >= 0 ? "上位決勝" : "上位";
  return m.code.indexOf("決勝") >= 0 ? "下位決勝" : "下位";
}
function query(){ return $("q").value.trim(); }
function matchHit(m, fl){
  var q = query();
  if (App.karaOnly && !fl.kz && !fl.poss) return false;
  var fc = $("f-cls").value;
  if (fc && m.cls !== fc) return false;
  if (!q) return true;
  if (m.code.indexOf(q) >= 0) return true;
  return m.slots.some(function(s){ return s[0] === "p" && (s[1].indexOf(q) >= 0 || (s[2] && s[2].indexOf(q) >= 0)); }) ||
    fl.rm.slots.some(function(s){ return s.name && s.name.indexOf(q) >= 0; });
}
function sideHtml(m, rm, sideIdx){
  var s = rm.slots[sideIdx];
  var decided = rm.decided;
  var cls = "side";
  if (decided !== null) cls += (decided === sideIdx ? " win" : " lose");
  var inner;
  if (s.name){
    inner = '<span class="nm">' + esc(s.name) + (decided === sideIdx ? '<span class="winmark">勝</span>' : '') + '</span>' +
      (s.team ? '<span class="tm">' + esc(s.team) + '</span>' : '');
  } else {
    inner = '<span class="lbl">' + esc(s.label || "未定") + '</span>';
  }
  if (decided === null && s.name && App.ready){
    return '<button class="' + cls + '" data-code="' + esc(m.code) + '" data-side="' + sideIdx + '">' + inner + '</button>';
  }
  return '<div class="' + cls + '">' + inner + '</div>';
}
function cardHtml(m, fl){
  var rm = fl.rm;
  var cls = "mcard" + (fl.kz ? " kz" : (fl.poss ? " poss" : "")) + (rm.decided !== null ? " decided" : "");
  var h = '<div class="' + cls + '" id="card-' + esc(m.code) + '">';
  h += '<div class="m-top"><span class="m-code">' + esc(m.code) + '</span>' +
    '<span class="m-phase' + (m.phase === "U" ? " u" : (m.phase === "W" ? " w" : "")) + '">' + esc(phaseShort(m)) + '</span>' +
    '<span class="m-court">' + m.court + 'コート</span>' +
    '<span class="m-time">' + esc(phaseLabel(m)) + '</span></div>';
  h += '<div class="vsrow">' + sideHtml(m, rm, 0) + '<span class="vsmid">vs</span>' + sideHtml(m, rm, 1) + '</div>';
  if (rm.decided === null && rm.slots[0].name && rm.slots[1].name && App.ready){
    h += '<div class="tapnote">勝った選手の名前をタップすると結果が全員に共有されます</div>';
  }
  h += '</div>';
  return h;
}
function allFlags(res){
  var map = {};
  DATA.matches.forEach(function(m){ map[m.code] = matchFlags(m, res); });
  return map;
}
function viewList(res, flags){
  var times = [];
  var byTime = {};
  DATA.matches.forEach(function(m){
    var fl = flags[m.code];
    if (!matchHit(m, fl)) return;
    if (!byTime[m.time]){ byTime[m.time] = []; times.push(m.time); }
    byTime[m.time].push(m);
  });
  times.sort();
  if (!times.length) return '<div class="empty">該当する試合がありません</div>';
  var h = '<div class="listwrap">';
  times.forEach(function(t){
    h += '<div class="thead">' + esc(t) + '〜</div>';
    byTime[t].sort(function(a, b){ return a.court - b.court; }).forEach(function(m){ h += cardHtml(m, flags[m.code]); });
  });
  return h + '</div>';
}
function viewGrid(res, flags){
  var times = [];
  var cell = {};
  DATA.matches.forEach(function(m){
    if (times.indexOf(m.time) < 0) times.push(m.time);
    cell[m.time + "|" + m.court] = m;
  });
  times.sort();
  var h = '<div class="gridwrap"><table class="tt"><thead><tr><th class="time">時刻</th>';
  for (var c = 1; c <= COURTS; c++) h += '<th>' + c + 'コート</th>';
  h += '</tr></thead><tbody>';
  times.forEach(function(t){
    h += '<tr><th class="time">' + esc(t) + '</th>';
    for (var c = 1; c <= COURTS; c++){
      var m = cell[t + "|" + c];
      if (!m){ h += '<td></td>'; continue; }
      var fl = flags[m.code], rm = fl.rm;
      var cls = fl.kz ? "kz" : (fl.poss ? "poss" : "");
      if (rm.decided !== null) cls += " decided";
      h += '<td class="' + cls + '" data-jump="' + esc(m.code) + '"><span class="code">' + esc(m.code) + ' ' + esc(phaseShort(m)) + '</span>';
      rm.slots.forEach(function(s, i){
        if (s.name){
          var wc = rm.decided === null ? "" : (rm.decided === i ? " win" : " lose");
          h += '<span class="who' + wc + '">' + esc(s.name) + '</span>';
          if (s.team) h += '<span class="tm">' + esc(s.team) + '</span>';
        } else {
          h += '<span class="lbl">' + esc(s.label || "未定") + '</span>';
        }
        if (i === 0) h += '<span class="lbl">vs</span>';
      });
      h += '</td>';
    }
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}
function viewStandings(res){
  var h = '<div class="cards">';
  var any = false;
  "ABCDEFG".split("").forEach(function(cls){
    if ($("f-cls").value && $("f-cls").value !== cls) return;
    var blocks = [];
    DATA.matches.forEach(function(m){ if (m.phase === "L" && m.cls === cls && blocks.indexOf(m.block) < 0) blocks.push(m.block); });
    blocks.sort();
    blocks.forEach(function(b){
      var st = standings(cls, b, res);
      if (!st.length) return;
      any = true;
      var total = blockMatches(cls, b).length;
      var done = blockMatches(cls, b).filter(function(m){ return res[m.code] !== undefined; }).length;
      h += '<div class="gtitle">' + cls + 'クラス ' + b + 'ブロック</div>';
      h += '<table class="st"><tr><th>順位</th><th>選手</th><th>勝-敗</th><th>進出</th></tr>';
      var prevW = null, rank = 0;
      st.forEach(function(p, i){
        if (p.w !== prevW){ rank = i + 1; prevW = p.w; }
        var zone = rank <= 2 ? "上位" : "下位";
        var kz = p.team && p.team.indexOf(TEAM) >= 0;
        h += '<tr class="' + (kz ? "kz " : "") + (rank <= 2 ? "zone-u" : "zone-w") + '"><td class="rk">' + rank + '</td>' +
          '<td>' + esc(p.name) + '<br><span style="font-size:11px;color:#777">' + esc(p.team || "") + '</span></td>' +
          '<td class="wl">' + p.w + '勝' + p.l + '敗</td><td>' + (done === total ? zone + "トーナメント" : "―") + '</td></tr>';
      });
      h += '</table><div class="blockmeta">リーグ ' + done + '/' + total + ' 試合入力済み' + (done === total ? '（全試合終了）' : '') + '。順位は勝ち数の自動計算です。</div>';
    });
  });
  if (!any) h += '<div class="empty">該当するブロックがありません</div>';
  return h + '</div>';
}
function viewPlayers(res, flags){
  var h = '<div class="cards">';
  var byCls = {};
  DATA.matches.forEach(function(m){
    if (m.phase !== "L") return;
    m.slots.forEach(function(s){
      if (s[0] === "p" && s[2] && s[2].indexOf(TEAM) >= 0){
        (byCls[m.cls] = byCls[m.cls] || []).push({player: s[1], match: m});
      }
    });
  });
  var q = query();
  Object.keys(byCls).sort().forEach(function(cls){
    if ($("f-cls").value && $("f-cls").value !== cls) return;
    var players = {};
    byCls[cls].forEach(function(x){ (players[x.player] = players[x.player] || []).push(x.match); });
    h += '<div class="gtitle">' + cls + 'クラス（唐崎ジュニア）</div>';
    Object.keys(players).sort().forEach(function(name){
      if (q && name.indexOf(q) < 0) return;
      var ms = players[name];
      var block = ms[0].block;
      h += '<div class="prow kz"><span class="pname">' + esc(name) + '</span> <span class="pmeta">' + cls + 'クラス ' + block + 'ブロック</span>';
      ms.slice().sort(function(a, b){ return a.time < b.time ? -1 : 1; }).forEach(function(m){
        var opp = m.slots[0][1] === name ? m.slots[1] : m.slots[0];
        var side = res[m.code];
        var mark = "";
        if (side !== undefined){
          var mySide = m.slots[0][1] === name ? 0 : 1;
          mark = side === mySide ? ' <span class="w">勝ち</span>' : ' <span class="l">負け</span>';
        }
        h += '<div class="pm">' + esc(m.time) + ' ' + m.court + 'コート ' + esc(m.code) + ' vs ' + esc(opp[1]) + '（' + esc(opp[2] || "") + '）' + mark + '</div>';
      });
      // この選手が入る可能性のあるトーナメント試合
      DATA.matches.forEach(function(m){
        if (m.phase === "L" || m.cls !== cls) return;
        var fl = flags[m.code];
        var involves = fl.rm.slots.some(function(s){ return s.name === name; }) ||
          m.slots.some(function(s){ return possiblePlayers(s, m).some(function(p){ return p.name === name; }); });
        if (involves){
          h += '<div class="pm">→ ' + esc(m.time) + ' ' + m.court + 'コート ' + esc(m.code) + '（' + esc(phaseLabel(m)) + '）: ' +
            fl.rm.slots.map(function(s){ return esc(s.name || s.label || "未定"); }).join(" vs ") +
            (fl.rm.decided !== null ? ' <span class="w">結果入力済み</span>' : '') + '</div>';
        }
      });
      h += '</div>';
    });
  });
  return h + '</div>';
}
function viewHistory(res){
  var eff = effectiveEntries(App.state.entries).slice().reverse();
  var h = '<div class="cards">';
  if (!eff.length) h += '<div class="empty">まだ結果が入力されていません</div>';
  eff.forEach(function(e){
    var m = MATCH[e.code]; if (!m) return;
    var rm = resolveMatch(m, (function(){ var r = Object.assign({}, res); return r; })());
    var winner = "?";
    // 勝者名は、その試合の入力時点ではなく現在の解決で表示（リーグは固定なので一致する）
    var slotsNow = m.slots[e.side];
    if (slotsNow && slotsNow[0] === "p") winner = slotsNow[1];
    else {
      var r2 = resolveMatch(m, res);
      if (r2.slots[e.side] && r2.slots[e.side].name) winner = r2.slots[e.side].name;
      else if (rm.slots[e.side]) winner = rm.slots[e.side].label || "?";
    }
    var d = new Date(e.at);
    var hh = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    h += '<div class="hrow">' + hh + '入力 ' + esc(e.code) + '（' + esc(phaseLabel(m)) + '） <span class="w">' + esc(winner) + ' の勝ち</span></div>';
  });
  return h + '</div>';
}
function render(){
  var res = resultsMap(App.state.entries);
  var flags = allFlags(res);
  var eff = effectiveEntries(App.state.entries);
  var cb = $("count-badge");
  cb.textContent = "結果 " + eff.length + "件入力済み";
  cb.classList.remove("hidden");
  $("btn-undo").classList.toggle("hidden", !eff.length);
  var main = $("list");
  if (App.tab === "list") main.innerHTML = viewList(res, flags);
  else if (App.tab === "grid") main.innerHTML = viewGrid(res, flags);
  else if (App.tab === "standings") main.innerHTML = viewStandings(res);
  else if (App.tab === "players") main.innerHTML = viewPlayers(res, flags);
  else if (App.tab === "history") main.innerHTML = viewHistory(res);
  bindActions();
}
function bindActions(){
  document.querySelectorAll("button.side").forEach(function(b){
    b.addEventListener("click", function(){ App.record(b.getAttribute("data-code"), parseInt(b.getAttribute("data-side"), 10)); });
  });
  document.querySelectorAll("[data-jump]").forEach(function(td){
    td.addEventListener("click", function(){
      var code = td.getAttribute("data-jump");
      App.tab = "list";
      document.querySelectorAll(".toolbar [data-tab]").forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-tab") === "list"); });
      render();
      var el = $("card-" + code);
      if (el){ el.scrollIntoView({block: "center"}); el.classList.add("flash"); }
    });
  });
}
(function init(){
  $("h-title").textContent = DATA.meta.title + " 共有タイムテーブル";
  $("h-meta").textContent = DATA.meta.dateLabel + " ｜ " + DATA.meta.venue + " ｜ " + TEAM + "を応援";
  document.querySelectorAll(".toolbar [data-tab]").forEach(function(b){
    b.classList.toggle("on", b.getAttribute("data-tab") === App.tab);
    b.addEventListener("click", function(){
      App.tab = b.getAttribute("data-tab");
      document.querySelectorAll(".toolbar [data-tab]").forEach(function(x){ x.classList.toggle("on", x === b); });
      render();
    });
  });
  $("q").addEventListener("input", render);
  $("f-cls").addEventListener("change", render);
  $("btn-kara").addEventListener("click", function(){
    App.karaOnly = !App.karaOnly;
    this.classList.toggle("on", App.karaOnly);
    render();
  });
  $("btn-undo").addEventListener("click", function(){ App.undo(); });
  $("btn-copy-url").addEventListener("click", function(){
    var url = location.href.split("#")[0];
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast("URLをコピーしました"); }, function(){ toast(url); });
    } else toast(url);
  });
  App.loadLocal();
  render();
  App.startSync();
})();
</script>
