<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>共有タイムテーブル</title>
<style>
:root{
  --navy:#0e2242; --blue:#1f5fd6; --blue-d:#174aab; --bg:#edf1f7; --card:#ffffff;
  --line:#d3dce8; --ink:#152238; --mut:#5a6a84; --amber:#f5b83d; --kz:#fff4cf;
  --green:#178a52; --green-bg:#e2f3e9; --purple:#6246c9; --purple-bg:#ece8fb;
  --orange:#e86a17; --red:#d64545; --radius:12px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif; margin:0; color:var(--ink); background:var(--bg); -webkit-text-size-adjust:100%;}
.num{font-variant-numeric:tabular-nums;}
header.top{background:var(--navy); color:#fff; padding:12px 14px 10px;}
header.top h1{font-size:16.5px; margin:0; line-height:1.4; font-weight:800;}
header.top .sub{font-size:12px; color:#b9c8e2; margin-top:2px;}
.statusrow{display:flex; align-items:center; gap:6px; margin-top:8px; font-size:12px; flex-wrap:wrap;}
.dot{width:9px; height:9px; border-radius:50%; background:#8fa3c4; display:inline-block;}
.dot.on{background:#35d07f;} .dot.mid{background:var(--amber);} .dot.off{background:#ff7a7a;}
.chip{border:1px solid #35507e; border-radius:999px; padding:2px 9px; font-size:11.5px; color:#dbe6fa; background:#16305c;}
.chip.strong{background:var(--amber); border-color:var(--amber); color:#231a05; font-weight:800;}
.chip button{all:unset; cursor:pointer; font:inherit; color:inherit;}
.vtabs{display:flex; gap:6px; max-width:980px; margin:0 auto; padding:8px 10px 0;}
.vtabs button{flex:1; font-family:inherit; font-size:13.5px; font-weight:800; padding:10px 6px; border-radius:10px; border:1.5px solid var(--navy); background:#fff; color:var(--navy); cursor:pointer; min-height:48px; line-height:1.3;}
.vtabs button small{display:block; font-size:11px; font-weight:600; color:var(--mut);}
.vtabs button.on{background:var(--navy); color:#fff;}
.vtabs button.on small{color:#b9c8e2;}
.toolbar{position:sticky; top:0; z-index:30; background:var(--bg); padding:8px 10px 6px; display:flex; gap:6px; align-items:center; max-width:980px; margin:0 auto;}
.toolbar .search{flex:1; min-width:0; font-size:16px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--line); background:#fff; min-height:48px;}
.toolbar select{font-size:14px; padding:10px 6px; border-radius:10px; border:1.5px solid var(--line); background:#fff; min-height:48px;}
.tgl{font-size:13px; font-weight:700; padding:10px 12px; border-radius:10px; border:1.5px solid var(--navy); background:#fff; color:var(--navy); min-height:48px; cursor:pointer; white-space:nowrap;}
.tgl.on{background:var(--navy); color:#fff;}
main{max-width:980px; margin:0 auto; padding:2px 10px 96px;}
.sec{font-size:13px; font-weight:800; color:var(--navy); margin:16px 2px 8px; display:flex; align-items:center; gap:8px;}
.sec::before{content:""; width:5px; height:16px; background:var(--blue); border-radius:3px;}
.sec .cnt{color:var(--mut); font-weight:600; font-size:12px;}
.mcard{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin-bottom:8px;}
.mcard.kz{border-color:var(--amber); background:var(--kz); box-shadow:0 1px 4px rgba(14,34,66,.10);}
.mcard.poss{background:#fbfcfe;}
.mcard.decided{background:#f2f5f9;}
.m-top{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.m-code{font-size:13.5px; font-weight:800; color:var(--navy);}
.ph{font-size:11px; color:#fff; background:var(--blue); border-radius:6px; padding:2px 7px; font-weight:800;}
.ph.u{background:var(--green);} .ph.w{background:var(--purple);}
.venue{font-size:11px; font-weight:800; border-radius:6px; padding:2px 7px; background:#e4ebf6; color:var(--navy);}
.venue.meino{background:#f3e3d3; color:#7a4416;}
.m-place{margin-left:auto; font-size:12.5px; color:var(--mut); font-weight:700;}
.vsrow{display:flex; align-items:stretch; gap:6px; margin-top:8px;}
.side{flex:1; border:1.5px solid var(--line); border-radius:10px; padding:9px 10px; background:#fff; text-align:left; font-family:inherit; min-height:52px;}
button.side{cursor:pointer;}
button.side:active{background:#e8f0fd;}
.side .nm{font-size:16.5px; font-weight:800; line-height:1.3; display:block;}
.mcard.kz .side .nm{font-size:17.5px;}
.side .tm{font-size:11px; color:var(--mut); display:block; margin-top:1px;}
.side .lbl{font-size:14px; font-weight:700; color:var(--mut); display:block; line-height:1.35;}
.side.win{border-color:var(--green); background:var(--green-bg);}
.side.win .nm{color:var(--green);}
.side.lose{opacity:.55;} .side.lose .nm{text-decoration:line-through;}
.winmark{font-size:11px; font-weight:800; color:#fff; background:var(--green); border-radius:5px; padding:1px 6px; margin-left:6px; vertical-align:2px;}
.vsmid{align-self:center; font-size:12px; color:#93a3ba; font-weight:800;}
.tapnote{font-size:11.5px; color:var(--mut); margin-top:7px;}
.gridwrap{overflow:auto; -webkit-overflow-scrolling:touch; background:#fff; border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px;}
table.tt{border-collapse:separate; border-spacing:0; width:100%;}
table.tt th, table.tt td{border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:4px; vertical-align:top; min-width:96px;}
table.tt thead th{background:var(--navy); color:#fff; font-size:12px; position:sticky; top:0; z-index:3; text-align:center;}
table.tt th.ord{background:#e4ebf6; color:var(--navy); font-size:12.5px; text-align:center; min-width:40px; position:sticky; left:0; z-index:2;}
table.tt thead th.ord{z-index:4;}
td .code{font-size:11px; font-weight:800; color:var(--mut);}
td.kz{background:var(--kz);} td.poss{background:#f4f8f1;} td.decided{background:#eef1f5;}
td .who{display:block; font-size:12px; font-weight:700; line-height:1.3;}
td .who.win{color:var(--green);} td .who.lose{color:#9aa7ba; text-decoration:line-through;}
td .lbl{display:block; font-size:11px; color:var(--mut); line-height:1.3;}
td .tm{display:block; font-size:10px; color:#93a3ba;}
.courtlist h3{font-size:13px; color:#fff; background:var(--navy); border-radius:8px; padding:6px 10px; margin:14px 0 8px;}
.lrow{display:flex; gap:8px; align-items:flex-start; margin-bottom:6px;}
.lrow .lo{font-weight:800; min-width:28px; text-align:right; color:var(--mut); padding-top:12px; font-size:13px;}
.lrow .mcard{flex:1; margin-bottom:0;}
table.st{border-collapse:collapse; width:100%; margin-bottom:4px; background:#fff; border-radius:var(--radius); overflow:hidden;}
table.st th, table.st td{border:1px solid var(--line); padding:6px 8px; font-size:13.5px;}
table.st th{background:#e4ebf6; font-size:12px; text-align:left; color:var(--navy);}
table.st td.rk{font-weight:800; text-align:center; width:52px;}
table.st tr.kz td{background:var(--kz); font-weight:700;}
table.st tr td.rk.u{background:#ffe9a8;} table.st tr td.rk.w{background:#ddd2f7;}
.blockmeta{font-size:11.5px; color:var(--mut); margin:2px 0 10px;}
.prow{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin-bottom:8px;}
.prow .pname{font-weight:800; font-size:16.5px;}
.prow .pmeta{font-size:11.5px; color:var(--mut);}
.prow .pm{font-size:12.5px; color:#33445e; margin-top:4px; line-height:1.55;}
.prow .pm .w{color:var(--green); font-weight:800;} .prow .pm .l{color:var(--purple); font-weight:800;}
.hrow{font-size:13.5px; padding:9px 12px; border:1px solid var(--line); border-radius:10px; margin-bottom:6px; background:#fff;}
.hrow .w{color:var(--green); font-weight:800;}
.btn-undo{display:block; width:100%; margin:10px 0 0; padding:13px; font-weight:800; font-size:14px; border-radius:10px; border:1.5px solid var(--purple); color:var(--purple); background:#fff; cursor:pointer; min-height:48px;}
.rankedit{background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; margin-bottom:10px;}
.rankrow{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
.rankrow .rankno{font-weight:800; color:var(--navy); min-width:36px;}
.rankrow select{flex:1; font-size:16px; padding:10px; border-radius:10px; border:1.5px solid var(--line); min-height:48px; background:#fff;}
.rankbtns{display:flex; gap:6px; flex-wrap:wrap; margin:2px 0 10px;}
.rankbtns button{font-family:inherit; font-size:13.5px; font-weight:800; padding:11px 14px; border-radius:10px; cursor:pointer; min-height:48px;}
.btn-save{background:var(--blue); border:1.5px solid var(--blue); color:#fff; flex:1;}
.btn-edit{background:#fff; border:1.5px solid var(--navy); color:var(--navy);}
.btn-cancel{background:#fff; border:1.5px solid var(--line); color:var(--mut);}
.empty{color:var(--mut); text-align:center; padding:26px 8px; font-size:14px;}
.note{font-size:12px; color:var(--mut); line-height:1.7; margin-top:14px;}
nav.bottom{position:fixed; left:0; right:0; bottom:0; z-index:40; background:#fff; border-top:1px solid var(--line); display:flex; padding-bottom:env(safe-area-inset-bottom);}
nav.bottom button{flex:1; border:none; background:none; font-family:inherit; font-size:11px; font-weight:700; color:var(--mut); padding:9px 1px 8px; cursor:pointer; min-height:52px;}
.bracket{display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:10px 4px; margin-bottom:10px;}
.bcol{display:flex; flex-direction:column; justify-content:space-around; gap:10px; min-width:150px; flex:1 0 auto; padding:0 11px;}
.bcol.final{justify-content:center; min-width:158px;}
.bbox{background:#fff; border:1.5px solid var(--line); border-radius:10px; padding:6px 8px; position:relative; cursor:pointer;}
.bcol:not(.final) .bbox::after{content:""; position:absolute; top:50%; width:11px; border-top:2px solid #b7c5da;}
.bcol.left .bbox::after{right:-12px;}
.bcol.right .bbox::after{left:-12px;}
.bbox.kz{border-color:var(--amber); background:var(--kz);}
.bbox.decided{background:#f2f5f9;}
.bbox .bcode{font-size:11px; font-weight:800; color:var(--navy); display:flex; justify-content:space-between; gap:6px;}
.bbox .bcode .bplace{color:var(--mut); font-weight:700;}
.bbox .brow{font-size:12.5px; font-weight:700; line-height:1.35; padding:2px 0; border-top:1px dashed var(--line); margin-top:3px; padding-top:5px;}
.bbox .brow:first-of-type{border-top:none; margin-top:2px; padding-top:0;}
.bbox .brow .btm{font-size:10px; color:var(--mut); font-weight:400; display:block;}
.bbox .brow.lbl{color:var(--mut); font-weight:600;}
.bbox .brow.win{color:var(--green);}
.bbox .brow.lose{color:#9aa7ba; text-decoration:line-through;}
.bchamp{text-align:center; font-weight:800; color:var(--navy); font-size:13px; margin-top:6px;}
.bchamp .cname{color:var(--green); font-size:15px;}
nav.bottom button .ic{display:block; font-size:17px; line-height:1.2;}
nav.bottom button.on{color:var(--blue);}
nav.bottom button.on .ic{color:var(--blue);}
#toast{position:fixed; left:50%; bottom:76px; transform:translateX(-50%) translateY(16px); background:var(--navy); color:#fff; padding:11px 18px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.25s; z-index:60; max-width:92vw; text-align:center;}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.hidden{display:none !important;}
.flash{animation:fl 1.6s;}
@keyframes fl{0%{box-shadow:0 0 0 5px var(--orange);}100%{box-shadow:0 0 0 0 transparent;}}
</style>
</head>

<script>
"use strict";
var DATA = JSON.parse(document.getElementById("tournament-data").textContent);
var TEAM = DATA.meta.team;
var MATCH = {}; DATA.matches.forEach(function(m){ MATCH[m.code] = m; });
var CATNAME = {"3BS":"3年生以下男子","3GS":"3年生以下女子","2BS":"2年生以下男子","2GS":"2年生以下女子","1BS":"1年生以下男子","1GS":"1年生以下女子","XS":"未就学男女"};

// === 結果の集計（LOGIC） ===
function effectiveEntries(entries){
  var undone = {};
  (entries||[]).forEach(function(e){ if (e && e.undo && e.target) undone[e.target] = true; });
  return (entries||[]).filter(function(e){ return e && !e.undo && !undone[e.id]; });
}
function mergeEntries(a, b){
  var byId = {}, out = [];
  [a||[], b||[]].forEach(function(list){
    list.forEach(function(e){ if (e && e.id && !byId[e.id]){ byId[e.id] = true; out.push(e); } });
  });
  out.sort(function(x, y){ return (x.at||0) - (y.at||0) || (x.id < y.id ? -1 : 1); });
  return out;
}
function resultsMap(entries){
  var map = {};
  effectiveEntries(entries).forEach(function(e){
    if (e.code && (e.side === 0 || e.side === 1) && !(e.code in map)) map[e.code] = e.side;
  });
  return map;
}
function blockPlayers(cls, block){
  var seen = {}, out = [];
  DATA.matches.forEach(function(m){
    if (m.phase === "L" && m.cls === cls && m.block === block){
      m.slots.forEach(function(s){
        if (s[0] === "p" && !seen[s[1]]){ seen[s[1]] = true; out.push({name: s[1], team: s[2]}); }
      });
    }
  });
  return out;
}
function blockMatches(cls, block){
  return DATA.matches.filter(function(m){ return m.phase === "L" && m.cls === cls && m.block === block; });
}
function standings(cls, block, res){
  // 勝ち数→直接対決（同勝者同士の勝ち数）で並べる。3人以上の完全な三つ巴は tied として分離不能にする
  var st = {};
  blockPlayers(cls, block).forEach(function(p){ st[p.name] = {name: p.name, team: p.team, w: 0, l: 0, tied: false}; });
  var h2h = {}; // h2h[winner] = {loser: true}
  blockMatches(cls, block).forEach(function(m){
    var side = res[m.code];
    if (side === undefined) return;
    var wn = m.slots[side][1], ln = m.slots[1 - side][1];
    if (st[wn]) st[wn].w++;
    if (st[ln]) st[ln].l++;
    (h2h[wn] = h2h[wn] || {})[ln] = true;
  });
  var arr = Object.keys(st).map(function(k){ return st[k]; });
  // 同じ勝ち数のグループごとに処理
  var byW = {};
  arr.forEach(function(p){ (byW[p.w] = byW[p.w] || []).push(p); });
  var out = [];
  Object.keys(byW).map(Number).sort(function(a, b){ return b - a; }).forEach(function(w){
    var g = byW[w];
    if (g.length === 1){ out.push(g[0]); return; }
    // グループ内の直接対決の勝ち数
    g.forEach(function(p){
      p._hw = g.reduce(function(n, o){ return n + ((h2h[p.name] || {})[o.name] ? 1 : 0); }, 0);
    });
    var byHw = {};
    g.forEach(function(p){ (byHw[p._hw] = byHw[p._hw] || []).push(p); });
    Object.keys(byHw).map(Number).sort(function(a, b){ return b - a; }).forEach(function(hw){
      var s = byHw[hw];
      if (s.length === 2){
        // 2人なら直接対決の勝者を上に（未入力なら名前順）
        var a = s[0], b = s[1];
        if ((h2h[b.name] || {})[a.name] && !(h2h[a.name] || {})[b.name]){ out.push(b, a); }
        else { out.push(a, b); }
      } else if (s.length === 1){ out.push(s[0]); }
      else {
        s.forEach(function(p){ p.tied = true; });
        s.sort(function(a, b){ return a.name < b.name ? -1 : 1; });
        s.forEach(function(p){ out.push(p); });
      }
    });
  });
  out.forEach(function(p){ delete p._hw; });
  return out;
}
function blockComplete(cls, block, res){
  return blockMatches(cls, block).every(function(m){ return res[m.code] !== undefined; });
}
function ranksMap(entries){
  // ブロックごとの手入力順位（公式順位）。最後に入力されたものが有効。ranks:null は解除
  var map = {};
  effectiveEntries(entries).forEach(function(e){
    if (!e.rankFor) return;
    if (e.ranks) map[e.rankFor] = e.ranks;
    else delete map[e.rankFor];
  });
  return map;
}
function rankPlayer(cls, block, rank, res, ranks){
  // 手入力の公式順位があれば最優先（リーグ結果が未入力でも枠に入る）
  if (ranks){
    var names = ranks[cls + "|" + block];
    if (names && names[rank - 1]){
      var found = null;
      blockPlayers(cls, block).forEach(function(p){ if (p.name === names[rank - 1]) found = p; });
      if (found) return found;
    }
  }
  if (!blockComplete(cls, block, res)) return null;
  var st = standings(cls, block, res);
  if (rank < 1 || rank > st.length) return null;
  var target = st[rank - 1];
  if (target.tied) return null;
  return target;
}
function slotLabel(slot){
  if (slot[0] === "r") return slot[1] + "ブロック" + slot[2] + "位";
  if (slot[0] === "w") return slot[1] + "の勝者";
  return "";
}
function resolveSlot(slot, res, ranks){
  if (slot[0] === "p") return {name: slot[1], team: slot[2], label: null};
  if (slot[0] === "w"){
    var src = MATCH[slot[1]];
    if (src && res[slot[1]] !== undefined){
      var inner = resolveMatch(src, res, ranks).slots[res[slot[1]]];
      if (inner && inner.name) return inner;
    }
    return {name: null, team: null, label: slotLabel(slot)};
  }
  return {name: null, team: null, label: slotLabel(slot)};
}
function resolveMatch(m, res, ranks){
  var slots = m.slots.map(function(s){
    if (s[0] === "r"){
      var p = rankPlayer(m.cls, s[1], s[2], res, ranks);
      if (p) return {name: p.name, team: p.team, label: null};
      return {name: null, team: null, label: slotLabel(s)};
    }
    return resolveSlot(s, res, ranks);
  });
  return {slots: slots, decided: (res[m.code] !== undefined ? res[m.code] : null)};
}
function possiblePlayers(slot, m, guard){
  guard = guard || {};
  if (guard[m.code]) return [];
  if (slot[0] === "p") return [{name: slot[1], team: slot[2]}];
  if (slot[0] === "r") return blockPlayers(m.cls, slot[1]);
  if (slot[0] === "w"){
    var src = MATCH[slot[1]];
    if (!src) return [];
    guard[m.code] = true;
    var out = [];
    src.slots.forEach(function(s2){ out = out.concat(possiblePlayers(s2, src, guard)); });
    return out;
  }
  return [];
}
function matchFlags(m, res, ranks){
  var rm = resolveMatch(m, res, ranks);
  var kz = rm.slots.some(function(s){ return s.team && s.team.indexOf(TEAM) >= 0; });
  var poss = false;
  if (!kz){
    poss = m.slots.some(function(s){
      return possiblePlayers(s, m).some(function(p){ return p.team && p.team.indexOf(TEAM) >= 0; });
    });
  }
  return {rm: rm, kz: kz, poss: poss};
}
// === LOGIC END ===

    var self = this;

    try{ client = mqtt.connect(BROKERS[idx], {clientId: "kztt-" + randStr(10), reconnectPeriod: 4000, connectTimeout: 9000, keepalive: 40, clean: true}); }
    catch(e){ if (idx + 1 < BROKERS.length) return this.connectBroker(idx + 1); this.setConn("off", "中継に接続できません"); return; }
    this.client = client;
    var got = false;
    setTimeout(function(){ if (!got && idx + 1 < BROKERS.length){ try{ client.end(true); }catch(e){} self.connectBroker(idx + 1); } }, 10000);
    client.on("connect", function(){
      got = true; self.connected = true; self.setConn("on", "共有中");
      client.subscribe(TOPIC_PREFIX + self.room, {qos: 1}, function(err){
        if (!err && self.state.seq > 0) self.publish();
      });
    });
    client.on("reconnect", function(){ self.connected = false; self.setConn("mid", "再接続中…"); });
    client.on("offline", function(){ self.connected = false; self.setConn("mid", "再接続中…"); });
    client.on("error", function(){ self.setConn("mid", "再接続中…"); });
    client.on("message", function(topic, buf){ try{ self.receive(JSON.parse(buf.toString())); }catch(e){} });
  },
  publish: function(){
    var self = this;
    if (!this.vhash) return;
    var stateJson = JSON.stringify(this.state);
    sha256hex(this.vhash + "|" + this.state.seq + "|" + stateJson).then(function(proof){
      var payload = {state: self.state, seq: self.state.seq, proof: proof};
      if (self.bc){ try{ self.bc.postMessage(payload); }catch(e){} }
      if (self.client && self.connected){ self.client.publish(TOPIC_PREFIX + self.room, JSON.stringify(payload), {retain: true, qos: 1}); }
    });
  },
  receive: function(payload){
    if (!payload || typeof payload.seq !== "number" || !payload.state || !this.vhash) return;
    var self = this;
    var stateJson = JSON.stringify(payload.state);
    sha256hex(this.vhash + "|" + payload.seq + "|" + stateJson).then(function(proof){
      if (proof !== payload.proof) return;
      var merged = mergeEntries(self.state.entries, payload.state.entries);
      var changedLocal = JSON.stringify(merged) !== JSON.stringify(self.state.entries);
      var differsRemote = JSON.stringify(merged) !== JSON.stringify(payload.state.entries);
      if (changedLocal){
        self.state = {v: 1, seq: Math.max(self.state.seq, payload.seq), entries: merged};
        self.ready = true;
        self.saveLocal();
        render();
      }
      if (differsRemote){
        self.state.seq = Math.max(self.state.seq, payload.seq) + 1;
        self.saveLocal();
        self.publish();
      }
    });
  },
  record: function(code, side){
    if (!this.ready) return;
    var m = MATCH[code]; if (!m) return;
    var res = resultsMap(this.state.entries);
    if (res[code] !== undefined) return;
    var rm = resolveMatch(m, res, ranksMap(this.state.entries));
    var s = rm.slots[side];
    this.state.entries.push({id: Date.now().toString(36) + randStr(4), code: code, side: side, at: Date.now()});
    this.state.seq += 1;
    this.saveLocal(); this.publish(); render();
    toast((s.name || s.label || "その側") + " の勝ち（" + code + "）を共有しました");
  },
  undo: function(){
    var eff = effectiveEntries(this.state.entries);
    if (!eff.length) return;
    var last = eff[eff.length - 1];
    this.state.entries.push({id: Date.now().toString(36) + randStr(4), undo: true, target: last.id, at: Date.now()});
    this.state.seq += 1;
    this.saveLocal(); this.publish(); render();
    toast("直前の入力を取り消しました");
  },
  editingBlock: null, rankDraft: null,
  recordRanks: function(cls, block, names){
    this.state.entries.push({id: Date.now().toString(36) + randStr(4), rankFor: cls + "|" + block, ranks: names, at: Date.now()});
    this.state.seq += 1;
    this.editingBlock = null; this.rankDraft = null;
    this.saveLocal(); this.publish(); render();
    toast((CATNAME[cls] || cls) + " " + block + "ブロックの順位を共有しました");
  },
  clearRanks: function(cls, block){
    this.state.entries.push({id: Date.now().toString(36) + randStr(4), rankFor: cls + "|" + block, ranks: null, at: Date.now()});
    this.state.seq += 1;
    this.editingBlock = null; this.rankDraft = null;
    this.saveLocal(); this.publish(); render();
    toast("順位の手入力を解除し、自動計算に戻しました");

};

function matchNum(code){
  var mm = code.match(/-(\d+)$/);

function bracketGroups(cls, phase){
  var ms = DATA.matches.filter(function(m){ return m.cls === cls && m.phase === phase; });
  if (!ms.length) return null;
  var fin = null;
  ms.forEach(function(m){ if (m.code.indexOf("決勝") >= 0) fin = m; });
  if (!fin) return null;
  var depthMemo = {};
  function depth(m){
    if (depthMemo[m.code] !== undefined) return depthMemo[m.code];
    depthMemo[m.code] = 0;
    var d = 0;
    m.slots.forEach(function(s){
      if (s[0] === "w" && MATCH[s[1]]) d = Math.max(d, depth(MATCH[s[1]]) + 1);
    });
    depthMemo[m.code] = d;
    return d;
  }
  function subtree(code, set){
    if (set[code]) return;
    set[code] = true;
    var m = MATCH[code];
    if (m) m.slots.forEach(function(s){ if (s[0] === "w") subtree(s[1], set); });
  }
  var leftSet = {}, rightSet = {};
  if (fin.slots[0] && fin.slots[0][0] === "w") subtree(fin.slots[0][1], leftSet);
  if (fin.slots[1] && fin.slots[1][0] === "w") subtree(fin.slots[1][1], rightSet);
  var maxD = depth(fin);
  var cols = {left: [], right: []};
  for (var d = 0; d < maxD; d++){ cols.left.push([]); cols.right.push([]); }
  ms.forEach(function(m){
    if (m === fin) return;
    var dd = depth(m);
    if (leftSet[m.code]) cols.left[dd].push(m);
    else if (rightSet[m.code]) cols.right[dd].push(m);
  });
  cols.left.forEach(function(c){ c.sort(function(a, b){ return matchNum(a.code) - matchNum(b.code); }); });
  cols.right.forEach(function(c){ c.sort(function(a, b){ return matchNum(a.code) - matchNum(b.code); }); });
  return {fin: fin, cols: cols, maxD: maxD};
}

      var frm = flags[g.fin.code].rm;
      if (frm.decided !== null && frm.slots[frm.decided].name){
        h += '<div class="bchamp">' + (ph[0] === "U" ? "優勝" : "下位T優勝") + '：<span class="cname">' + esc(frm.slots[frm.decided].name) + '</span></div>';
      }
    });
  });
  if (!any) h += '<div class="empty">該当するトーナメント表がありません</div>';
  return h;
}
function viewHistory(res, ranks){
  var eff = effectiveEntries(App.state.entries).slice().reverse();
  var h = '<button class="btn-undo' + (eff.length ? "" : " hidden") + '" id="btn-undo" type="button">直前の入力を1つ取り消す</button>';
  if (!eff.length) h += '<div class="empty">まだ結果が入力されていません</div>';
  eff.forEach(function(e){
    var d = new Date(e.at);
    var hh = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
    if (e.rankFor){
      var parts = e.rankFor.split("|");
      var label = (CATNAME[parts[0]] || parts[0]) + " " + parts[1] + "ブロック";
      h += '<div class="hrow num">' + hh + '入力 ' + esc(label) + (e.ranks ? ' の順位を手入力（1位 ' + esc(e.ranks[0] || "") + '）' : ' の順位の手入力を解除') + '</div>';
      return;
    }
    var m = MATCH[e.code]; if (!m) return;
    var rm = resolveMatch(m, res, ranks);
    var s = rm.slots[e.side];
    var winner = s.name || s.label || "?";
    h += '<div class="hrow num">' + hh + '入力 ' + esc(e.code) + '（' + esc(phaseLabel(m)) + '） <span class="w">' + esc(winner) + ' の勝ち</span></div>';
  });
  return h;
}
function render(){
  var res = resultsMap(App.state.entries);
  var ranks = ranksMap(App.state.entries);
  var flags = allFlags(res, ranks);
  var eff = effectiveEntries(App.state.entries);
  var cb = $("count-badge");
  cb.textContent = "結果 " + eff.length + "件入力済み";
  cb.classList.remove("hidden");
  var main = $("list");
  if (App.tab === "next") main.innerHTML = viewNext(res, flags);
  else if (App.tab === "list") main.innerHTML = viewList(res, flags);
  else if (App.tab === "grid") main.innerHTML = viewGrid(res, flags);
  else if (App.tab === "bracket") main.innerHTML = viewBracket(res, flags);
  else if (App.tab === "standings") main.innerHTML = viewStandings(res, flags, ranks);
  else if (App.tab === "history") main.innerHTML = viewHistory(res, ranks);
  bindActions();
}
function bindActions(){
  document.querySelectorAll("button.side").forEach(function(b){
    b.addEventListener("click", function(){ App.record(b.getAttribute("data-code"), parseInt(b.getAttribute("data-side"), 10)); });
  });
  document.querySelectorAll("[data-jump]").forEach(function(td){
    td.addEventListener("click", function(){
      var code = td.getAttribute("data-jump");
      App.tab = "list";
      syncTabBar();
      render();
      var el = $("card-" + code);
      if (el){ el.scrollIntoView({block: "center"}); el.classList.add("flash"); }
    });
  });
  var undo = $("btn-undo");
  if (undo) undo.addEventListener("click", function(){ App.undo(); });
  document.querySelectorAll("[data-editranks]").forEach(function(b){
    b.addEventListener("click", function(){
      var key = b.getAttribute("data-editranks");
      var parts = key.split("|");
      var res = resultsMap(App.state.entries);
      var ranks = ranksMap(App.state.entries);
      var st = standings(parts[0], parts[1], res);
      var manual = ranks[key];
      App.editingBlock = key;
      App.rankDraft = manual ? manual.slice() : st.map(function(p){ return p.name; });
      render();
    });
  });
  document.querySelectorAll("[data-cancelranks]").forEach(function(b){
    b.addEventListener("click", function(){ App.editingBlock = null; App.rankDraft = null; render(); });
  });
  document.querySelectorAll("[data-clearranks]").forEach(function(b){
    b.addEventListener("click", function(){
      var parts = b.getAttribute("data-clearranks").split("|");
      App.clearRanks(parts[0], parts[1]);
    });
  });
  document.querySelectorAll("[data-ranksel]").forEach(function(sel){
    sel.addEventListener("change", function(){
      if (!App.rankDraft) return;
      App.rankDraft[parseInt(sel.getAttribute("data-ranksel"), 10)] = sel.value;
    });
  });
  document.querySelectorAll("[data-saveranks]").forEach(function(b){
    b.addEventListener("click", function(){
      var key = b.getAttribute("data-saveranks");
      var parts = key.split("|");
      var draft = App.rankDraft || [];
      var uniq = {};
      var valid = draft.length === blockPlayers(parts[0], parts[1]).length;
      draft.forEach(function(n){ if (uniq[n]) valid = false; uniq[n] = true; });
      if (!valid){ toast("同じ選手が重なっています。全員の順位を選んでください"); return; }
      App.recordRanks(parts[0], parts[1], draft.slice());
    });
  });
}
function syncTabBar(){
  document.querySelectorAll("#tabbar [data-tab]").forEach(function(x){
    x.classList.toggle("on", x.getAttribute("data-tab") === App.tab);
  });
}
function syncVtabs(){
  document.querySelectorAll("#vtabs [data-venue]").forEach(function(x){
    x.classList.toggle("on", x.getAttribute("data-venue") === App.venue);
  });
}
(function init(){
  $("h-title").textContent = DATA.meta.title + " 共有タイムテーブル";
  $("h-meta").textContent = DATA.meta.dateLabel + " ｜ " + DATA.meta.venue + " ｜ " + TEAM + "の試合をみんなで入力";
  var sel = $("f-cls");
  var cats = [];
  DATA.matches.forEach(function(m){ if (cats.indexOf(m.cls) < 0) cats.push(m.cls); });
  cats.sort().forEach(function(c){
    var o = document.createElement("option");
    o.value = c; o.textContent = CATNAME[c] || c;
    sel.appendChild(o);
  });
  document.querySelectorAll("#tabbar [data-tab]").forEach(function(b){
    b.addEventListener("click", function(){ App.tab = b.getAttribute("data-tab"); syncTabBar(); render(); });
  });
  try{ App.venue = localStorage.getItem("kztt_venue_" + App.room) || ""; }catch(e){}
  syncVtabs();
  document.querySelectorAll("#vtabs [data-venue]").forEach(function(b){
    b.addEventListener("click", function(){
      App.venue = b.getAttribute("data-venue");
      try{ localStorage.setItem("kztt_venue_" + App.room, App.venue); }catch(e){}
      syncVtabs();
      render();
    });
  });
  $("q").addEventListener("input", render);
  sel.addEventListener("change", render);
  $("btn-kara").addEventListener("click", function(){
    App.karaOnly = !App.karaOnly;
    this.classList.toggle("on", App.karaOnly);
    render();
  });
  $("btn-copy-url").addEventListener("click", function(){
    var url = location.href.split("#")[0];
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast("URLをコピーしました"); }, function(){ toast(url); });
    } else toast(url);
  });
  var note = document.createElement("p");
  note.className = "note";
  note.textContent = "使い方：勝った選手（または枠）をタップすると全員の画面に反映されます。間違えたら「履歴」から直前の入力を取り消せます。リーグ結果がそろうと順位が自動計算されますが、「順位・選手」タブで公式順位を入力するとそちらが優先され、決勝T（小俣）・下位T（明野小）の枠に名前が入ります。この大会は流し込み方式で時刻はありません。「そのコートの何試合目か」で確認してください。";
  $("list").after(note);
  App.loadLocal();
  render();
  App.startSync();
})();
</script>
</body>
</html>
